<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>草莓小熊记账</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>

  <!-- 隐藏的截图识别文件选择器 -->
  <input type="file" id="shot" accept="image/*" style="display:none">

  <!-- 右下角悬浮按钮：截图识别 + 记一笔 -->
  <button id="cam" aria-label="截图识别记账" style="display:none">📷</button>
  <button id="fab" aria-label="记一笔">＋</button>

  <!-- 底部导航栏 -->
  <nav id="nav"></nav>

  <!-- 依赖同步合并库（如你有独立的 lm.js / sync.js 请保留在 app.js 之前） -->
  <script src="lm.js"></script>
  <script src="app.js"></script>
</body>
</html>
